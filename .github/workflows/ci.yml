name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Three independent jobs rather than three steps in one.
#
# As a single fail-fast job, `lint` and `typecheck` ran ahead of `test`, so one
# unused import anywhere in the repo was enough to stop the test suite from ever
# executing. That is not an acceptable arrangement for a suite whose job is to
# block on semantic drift: the WBS/preset round-trip guard has to be able to go
# red on its own merits, and to be requireable as its own status check.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # pnpm 11 requires Node >=22.13. Pinned to 20, `pnpm install` died before
      # any check ran — which is why CI reported nothing but red from
      # 2026-07-15 onwards.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_estimation
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/ai_estimation?schema=public
      # schema.prisma declares directUrl = env("DIRECT_URL"). vitest.setup.ts
      # derives it for tests, but `prisma migrate deploy` runs outside vitest.
      DIRECT_URL: postgresql://postgres:postgres@localhost:5433/ai_estimation?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install

      # The pgvector service starts empty and nothing else migrates it —
      # @repo/db's postinstall runs `prisma generate` only. Roughly half the
      # suite is DB-backed and would meet an empty schema without this.
      - name: Migrate test database
        run: pnpm --filter @repo/db exec prisma migrate deploy

      - run: pnpm test

  # The e2e suite gated nothing until now: it existed, but no job ran it, so it
  # was only ever run by hand and a merge could not go red on it. That is how a
  # broken /dashboard reached master under AEH-253 with lint, typecheck and test
  # all green.
  #
  # DB choice: a local pgvector service, same as `test` above, rather than the
  # Neon test branch the suite uses locally. No secret to provision, hermetic per
  # run, and nothing to leak into a fork's PR — the Neon branch would also be
  # shared mutable state across concurrent runs, and global-setup truncates it.
  e2e:
    runs-on: ubuntu-latest
    # ~9 min of tests locally, plus install, browser download and cold compiles.
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_estimation_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # playwright.config.ts and e2e/global-setup.ts both THROW without this —
      # deliberately, so a run can never be pointed at a real database. It is
      # also what the config hands the app under test as DATABASE_URL/DIRECT_URL.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/ai_estimation_test?schema=public
      # The only other required server env (src/lib/env.ts REQUIRED_SERVER_ENV).
      # A throwaway value: these sessions live for one job.
      AUTH_SECRET: e2e-ci-not-a-real-secret-e2e-ci-not-a-real
      NEXTAUTH_SECRET: e2e-ci-not-a-real-secret-e2e-ci-not-a-real
      # AUTH_URL is deliberately unset — auth.config.ts sets trustHost, so the
      # origin comes from the request and port 3001 works without configuration.
      #
      # Nothing else is needed. The config's webServer env blanks the Google
      # credentials and sets OPENROUTER_STUB=1, so no spec makes a third-party
      # call; ENCRYPTION_KEY stays unset exactly as it is in a local run.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install

      # scripts/setup-test-db.sh is skipped on purpose: it shells out to
      # `docker compose exec` to create the database, and here the service
      # container already has it. Only the migrate half applies.
      - name: Migrate e2e database
        run: pnpm --filter @repo/db exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}

      # --with-deps pulls the system libraries the bundled Chromium needs; the
      # runner image does not carry them. Chromium only — the config declares a
      # single project.
      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - run: pnpm --filter web exec playwright test

      # `trace: 'retain-on-failure'` leaves a trace for each failed test. On CI
      # that is the only way to see what the browser actually did.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7
